name: CI/CD — ATS RANDA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  POSTGRES_USER: ats_user
  POSTGRES_PASSWORD: ats_test_password
  POSTGRES_DB: ats_db_test

jobs:

  # ════════════════════════════════════════
  # JOB 1 — Tests Backend
  # ════════════════════════════════════════
  test-backend:
    name: 🧪 Tests Python
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx flake8 black

      - name: 🔍 Lint — flake8
        run: |
          cd backend
          flake8 app/ --max-line-length=100 --exclude=migrations/ --ignore=E501,W503

      - name: 🎨 Format check — black
        run: |
          cd backend
          black app/ --check --line-length=100

      - name: 🧩 Activer extension pgvector
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
            -h localhost -U ${{ env.POSTGRES_USER }} \
            -d ${{ env.POSTGRES_DB }} \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: ✅ Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_for_ci_only_min_32_chars
          DEBUG: "true"
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_HOST: localhost
          REDIS_PASSWORD: ""
          REDIS_HOST: localhost
        run: |
          cd backend
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -x

      - name: 📊 Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ════════════════════════════════════════
  # JOB 2 — Build Frontend
  # ════════════════════════════════════════
  test-frontend:
    name: ⚛️ Build Frontend TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: |
          cd frontend
          npm ci

      - name: 🔍 Lint — ESLint
        run: |
          cd frontend
          npm run lint 2>/dev/null || echo "::warning::ESLint non configuré"

      - name: 🏗️ Build TypeScript
        run: |
          cd frontend
          npm run build

      - name: 📁 Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7

  # ════════════════════════════════════════
  # JOB 3 — Docker Build
  # ════════════════════════════════════════
  build-docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ats-randa-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Vérification config
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://test:test@localhost/test \
            -e SECRET_KEY=test_secret_key_for_health_check_ci \
            -e REDIS_PASSWORD="" \
            -e REDIS_HOST=localhost \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -e POSTGRES_HOST=localhost \
            ats-randa-backend:${{ github.sha }} \
            python -c "from app.core.config import settings; print('Config OK:', settings.APP_NAME)"

  # ════════════════════════════════════════
  # JOB 4 — Security Scan
  # ════════════════════════════════════════
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔐 Install security tools
        run: pip install bandit safety

      - name: 🔍 Bandit — scan sécurité code
        run: |
          cd backend
          bandit -r app/ -ll -x app/tests/ || true

      - name: 🔒 Safety — scan dépendances
        run: |
          cd backend
          safety check -r requirements.txt --full-report || true

  # ════════════════════════════════════════
  # JOB 5 — Résumé CI
  # ════════════════════════════════════════
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-docker]
    if: always()

    steps:
      - name: 📋 Résumé pipeline
        run: |
          echo "════════════════════════════════════════"
          echo "  ATS RANDA — CI/CD Pipeline Summary"
          echo "════════════════════════════════════════"
          echo "  Backend Tests : ${{ needs.test-backend.result }}"
          echo "  Frontend Build: ${{ needs.test-frontend.result }}"
          echo "  Docker Build  : ${{ needs.build-docker.result }}"
          echo "  Commit        : ${{ github.sha }}"
          echo "  Branch        : ${{ github.ref_name }}"
          echo "  Triggered by  : ${{ github.actor }}"
          echo "════════════════════════════════════════"
          if [[ "${{ needs.test-backend.result }}" == "failure" || \
                "${{ needs.test-frontend.result }}" == "failure" || \
                "${{ needs.build-docker.result }}" == "failure" ]]; then
            echo "❌ Pipeline FAILED"
            exit 1
          else
            echo "✅ Pipeline SUCCESS"
          fi
