# ════════════════════════════════════════════════════
# ATS RANDA — Production Docker Compose
# Différences vs développement :
#   - Pas de volume mount du code (image immuable)
#   - Pas de --reload uvicorn (4 workers uvloop)
#   - Ressources limitées (memory/cpu)
#   - Logs JSON structurés avec rotation
#   - Healthchecks stricts + start_period
#   - Frontend servi statiquement par Nginx
# ════════════════════════════════════════════════════

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ats_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.2-alpine
    container_name: ats_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ats_backend
    restart: always
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ats_celery
    restart: always
    command: >
      celery -A app.core.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=1000
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '4'
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ats_flower
    restart: always
    command: >
      celery -A app.core.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower123}
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: ats_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: ats_redis_exporter
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - ats_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ats_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats_network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ats_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ats_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:         ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:     ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP:         "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - ats_network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  prometheus_data:
  grafana_data:

networks:
  ats_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
