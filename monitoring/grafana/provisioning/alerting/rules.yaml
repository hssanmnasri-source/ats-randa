apiVersion: 1

groups:
  - name: ATS RANDA Alertes
    folder: ATS
    interval: 1m
    rules:

      - uid: ats-alert-5xx
        title: "Taux d'erreur 5xx eleve"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) * 60
              refId: A
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: C
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          description: "Plus de 5 erreurs 5xx par minute detectees sur ATS RANDA"
          summary: "Erreurs serveur ATS RANDA"
        labels:
          severity: critical

      - uid: ats-alert-latency
        title: "Latence API degradee P95 sup 3s"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) * 1000
              refId: A
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: C
              conditions:
                - evaluator:
                    params: [3000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          description: "La latence P95 depasse 3 secondes"
          summary: "Performance API ATS RANDA degradee"
        labels:
          severity: warning

      - uid: ats-alert-celery
        title: "Worker Celery indisponible"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: flower_workers_online_total
              refId: A
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: C
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          description: "Aucun worker Celery actif - taches d'embedding bloquees"
          summary: "Worker Celery ATS RANDA down"
        labels:
          severity: critical

      - uid: ats-alert-redis-mem
        title: "Memoire Redis superieure a 80 pourcent"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: redis_memory_used_bytes / redis_memory_max_bytes * 100
              refId: A
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              refId: C
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: "Redis utilise plus de 80% de sa memoire maximale"
          summary: "Memoire Redis saturee"
        labels:
          severity: warning
